services:
  database:
    image: mongo:7
    command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    - --wiredTigerCacheSizeGB
    - '0.25'
    restart: unless-stopped
    volumes:
    - mongo-data:/data/db
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --eval ''try { if (!rs.status().ok) quit(1); } catch (e)
        { rs.initiate({_id: "rs0", members: [{_id: 0, host: "database:27017"}]});
        quit(1); }'''
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 384m
    cpus: '1.0'
    pids_limit: 160
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  backend:
    image: ${KNOXX_BACKEND_IMAGE:?Built backend image required}
    restart: unless-stopped
    user: 1000:1000
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8000'
      MONGODB_URI: mongodb://database:27017/?replicaSet=rs0
      MONGODB_DB: knoxx
      KNOXX_OPENPLANNER_CLIENT_MODE: ${KNOXX_OPENPLANNER_CLIENT_MODE:-mongo}
      # Graph memory (graph_query/graph-memory!) delegates to the REST client even in
      # mongo mode. Staging requires it (integration gate memory-roundtrip); the
      # key is per-environment and never shared with another slot or production.
      OPENPLANNER_BASE_URL: ${OPENPLANNER_BASE_URL:-}
      OPENPLANNER_API_KEY: ${OPENPLANNER_API_KEY:-}
      # Per-environment Proxx identity and budget; never the production token.
      PROXX_BASE_URL: ${PROXX_BASE_URL:-}
      PROXX_AUTH_TOKEN: ${PROXX_AUTH_TOKEN:-}
      PROXX_DEFAULT_MODEL: ${PROXX_DEFAULT_MODEL:-}
      KNOXX_AXXIUM_ORIGIN: ${KNOXX_AXXIUM_ORIGIN:?Local identity authority required}
      KNOXX_PUBLIC_BASE_URL: ${KNOXX_PUBLIC_BASE_URL}
      KNOXX_BASE_URL: ${KNOXX_PUBLIC_BASE_URL}
      KNOXX_PUBLICATION_SITE_URL: ${KNOXX_PUBLIC_BASE_URL}
      KNOXX_SESSION_SECRET: ${KNOXX_SESSION_SECRET:?Instance secret required}
      KNOXX_API_KEY: ${KNOXX_API_KEY:?Operator key required}
      KNOXX_API_KEY_USER_EMAIL: system-admin@cross-host.local
      KNOXX_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: system-admin@cross-host.local
      KNOXX_PRIMARY_ORG_SLUG: cross-host
      KNOXX_PRIMARY_ORG_NAME: Cross-host Workspace
      KNOXX_DISABLE_EVENT_RUNTIMES: 'true'
      CONTRACTS_DIR: /app/contracts
      KNOXX_CONTRACTS_DIR: /app/contracts
      KNOXX_GENERATED_CONTRACTS_DIR: /state/generated-contracts
      KNOXX_PUBLICATION_CONTENT_ROOT: /state/content
      WORKSPACE_ROOT: /state/workspace
    volumes:
    - ./state:/state
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8000/api/auth/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: '1.0'
    pids_limit: 160
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
  frontend:
    image: ${KNOXX_FRONTEND_IMAGE:?Built frontend image required}
    restart: unless-stopped
    user: 1000:1000
    ports:
    - 127.0.0.1:${KNOXX_LISTEN_PORT:-18880}:8080
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    cpus: '1.0'
    pids_limit: 160
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8080/api/auth/config
      interval: 15s
      timeout: 5s
      retries: 12
volumes:
  mongo-data: null
