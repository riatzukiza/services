# Caddy — the single owner of host ports 80 and 443.
#
# Decision, 2026-10-15: keep exact-name automatic HTTPS with Caddy's existing
# default HTTP-01/TLS-ALPN-01 challenges and DNS-only direct-origin records.
# The capacity envelope is 18 names: 7 on main, 8 in unmerged PR83, 1 planned
# Proxx staging name and 2 reserved production aliases. Those tiers do not
# establish route adoption or live deployment. These challenges need no
# Cloudflare API credentials or DNS-provider module on the ingress host.
# Revisit before exceeding 20 managed names or planning more than 20 fresh /
# non-ARI issuances in rolling 7 days. These are local review ceilings; Let's
# Encrypt's registered-domain budget is shared with every other LE client
# using promethean.rest. Preserve ACME state; never migrate by reissuing all
# names from empty storage. Inventory, limits, alternatives and recovery:
# docs/caddy-hostname-certificate-decision.md.
#
# Exactly one ingress owner, per #27.

name: caddy

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_KNOXX_HOST: ${KNOXX_PUBLIC_HOST:?KNOXX_PUBLIC_HOST must be set}
      CADDY_PROXX_HOST: ${PROXX_PUBLIC_HOST:?PROXX_PUBLIC_HOST must be set}
      CADDY_WEBSITE_HOST: ${WEBSITE_PUBLIC_HOST:?WEBSITE_PUBLIC_HOST must be set}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL must be set}
      CADDY_KNOXX_DEV_HOST: ${CADDY_KNOXX_DEV_HOST:?CADDY_KNOXX_DEV_HOST must be set}
      CADDY_OPENCODE_DEV_HOST: ${CADDY_OPENCODE_DEV_HOST:?CADDY_OPENCODE_DEV_HOST must be set}
      CADDY_SHADOW_DEV_HOST: ${CADDY_SHADOW_DEV_HOST:?CADDY_SHADOW_DEV_HOST must be set}
      # Keep the `:?` guards. Without them, an unset hash would render the
      # basic_auth directive with an empty credential, which Caddy accepts and
      # which authenticates nobody against nothing — an open door, not an error.
      DEV_BASIC_AUTH_USER: ${DEV_BASIC_AUTH_USER:?DEV_BASIC_AUTH_USER must be set}
      DEV_BASIC_AUTH_HASH: ${DEV_BASIC_AUTH_HASH:?DEV_BASIC_AUTH_HASH must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Retain complete /data and /config: certificate keys, ACME accounts and
      # renewal metadata. Back up securely and restore state before serving
      # after a move; ordinary deploys/rollback must not erase these paths.
      # Losing state can trigger issuance against shared registered-domain
      # and exact-identifier-set limits; see the decision linked above.
      - ${CADDY_STATE_PATH}/data:/data
      - ${CADDY_STATE_PATH}/config:/config
      - ${CADDY_STATE_PATH}/managed:/etc/caddy/managed:ro
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      default:
        aliases:
          - caddy
      # The fixed address is the firewall identity for host-resident dev
      # services. Do not attach any other container to this network.
      dev-ingress:
        ipv4_address: 172.31.255.2

networks:
  default:
    name: open-hax
    external: true
  dev-ingress:
    name: caddy-dev-ingress
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/28
          gateway: 172.31.255.1
